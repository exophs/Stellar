<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellar</title>
  <link rel="icon" type="image/x-icon" href="https://cdn.glitch.global/58cc88e6-fae4-4d3a-9fee-87a8518eb0a0/exophsOS%2Ffavicon.png?v=1741142850948" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0a0b0f;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-light: rgba(255,255,255,0.14);
      --text: #e8e9ef;
      --text-muted: #6b6f7e;
      --text-dim: #9a9db0;
      --accent: #7c6af7;
      --accent-soft: rgba(124,106,247,0.15);
      --green: #3ecf8e;
      --yellow: #e8c547;
      --red: #f16060;
      --spotify: #1db954;
      --online: #3ecf8e;
      --idle: #e8c547;
      --dnd: #f16060;
      --offline: #4a4d5a;
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.45;
      pointer-events: none;
    }

    .stars-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 150%;
      transform: rotate(-45deg);
      z-index: 0;
      pointer-events: none;
    }

    .star {
      --star-color: #b388ff;
      --star-tail-length: 6em;
      --star-tail-height: 2px;
      --star-width: calc(var(--star-tail-length) / 6);
      --fall-duration: 12s;
      --tail-fade-duration: var(--fall-duration);
      position: absolute;
      top: var(--top-offset);
      left: 0;
      width: var(--star-tail-length);
      height: var(--star-tail-height);
      color: var(--star-color);
      background: linear-gradient(45deg, currentColor, transparent);
      border-radius: 50%;
      filter: drop-shadow(0 0 6px currentColor);
      transform: translate3d(150em, 0, 0);
      animation:
        fall var(--fall-duration) var(--fall-delay) linear infinite,
        tail-fade var(--tail-fade-duration) var(--fall-delay) ease-out infinite;
    }

    .star::before, .star::after {
      content: "";
      position: absolute;
      top: 0;
      left: calc(var(--star-width) / -2);
      width: var(--star-width);
      height: 100%;
      background: linear-gradient(45deg, transparent, currentColor, transparent);
      border-radius: inherit;
      animation: blink 2s linear infinite;
    }

    .star::before { transform: rotate(45deg); }
    .star::after  { transform: rotate(-45deg); }

    @keyframes fall { to { transform: translate3d(-30em, 0, 0); } }

    @keyframes tail-fade {
      0% { width: 0; opacity: 0; }
      10% { width: var(--star-tail-length); opacity: 1; }
      50% { width: var(--star-tail-length); opacity: 1; }
      70%, 80% { width: 0; opacity: 0.4; }
      100%     { width: 0; opacity: 0; }
    }

    @keyframes blink { 50% { opacity: 0.6; } }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 16px;
    }

    .wordmark {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      margin-bottom: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 12px;
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      overflow: hidden;
      transition: border-color 0.25s ease;
    }

    .card:hover {
      border-color: var(--border-light);
    }

    .card-inner {
      padding: 20px;
    }

    .profile-card .card-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: block;
      background: var(--surface-hover);
      border: 2px solid var(--border);
    }

    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2.5px solid var(--bg);
      background: var(--offline);
      transition: background 0.3s ease;
    }

    .status-dot.online  { background: var(--online); }
    .status-dot.idle    { background: var(--idle); }
    .status-dot.dnd     { background: var(--dnd); }
    .status-dot.offline { background: var(--offline); }

    .name-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .display-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .username {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }

    .custom-status {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .custom-status img {
      height: 18px;
      width: 18px;
      object-fit: contain;
    }

    .platform-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .platform-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      transition: color 0.2s, border-color 0.2s;
    }

    .platform-chip.active {
      color: var(--accent);
      border-color: rgba(124,106,247,0.35);
    }

    .platform-chip i { font-size: 10px; }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    .kv-block {
      width: 100%;
    }

    .kv-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 8px;
    }

    .kv-pairs {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .kv-pair {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      gap: 8px;
    }

    .kv-key { color: var(--text-muted); }
    .kv-val { color: var(--text-dim); text-align: right; word-break: break-all; }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 12px;
    }

    .spotify-card .card-inner {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .spotify-top {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .album-art {
      width: 68px;
      height: 68px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--surface-hover);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .spotify-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .spotify-tag {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--spotify);
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .spotify-tag i { font-size: 11px; }

    .song-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
    }

    .song-title:hover { color: var(--accent); }

    .artist-name {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album-name {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      font-family: 'DM Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-wrap {
      margin-top: 14px;
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--spotify);
      border-radius: 3px;
      width: 0%;
      transition: width 1s linear;
    }

    .no-spotify {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 13px;
      padding: 8px 0;
    }

    .no-spotify i { font-size: 20px; color: var(--border-light); }

    .activities-card .card-inner {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .activity-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .activity-art-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .activity-large-img {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      background: var(--surface-hover);
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .activity-small-img {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--surface-hover);
      object-fit: cover;
    }

    .activity-info {
      flex: 1;
      min-width: 0;
    }

    .activity-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .activity-details, .activity-state {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'DM Mono', monospace;
    }

    .activity-elapsed {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-top: 3px;
    }

    .no-activity {
      color: var(--text-muted);
      font-size: 13px;
    }

    .music-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,11,15,0.85);
      border: 1px solid var(--border);
      border-radius: 50px;
      backdrop-filter: blur(20px);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      white-space: nowrap;
      max-width: calc(100vw - 40px);
      overflow: hidden;
    }

    .music-bar-track {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 13px;
      line-height: 1;
      transition: color 0.15s;
      display: flex;
      align-items: center;
    }

    .music-btn:hover { color: var(--text); }
    .music-btn.active { color: var(--accent); }

    .vol-slider {
      width: 60px;
      -webkit-appearance: none;
      height: 3px;
      background: var(--border-light);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }

    .conn-badge {
      position: fixed;
      top: 16px;
      right: 16px;
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .conn-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--offline);
      transition: background 0.3s;
    }

    .conn-badge.connected .conn-dot { background: var(--green); }
    .conn-badge.reconnecting .conn-dot { background: var(--yellow); animation: pulse 1s infinite; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    @media (max-width: 620px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .profile-card .card-inner {
        flex-direction: row;
        text-align: left;
        align-items: center;
      }
      .name-block, .custom-status, .platform-row, .kv-block {
        align-items: flex-start;
        justify-content: flex-start;
      }
      .custom-status { justify-content: flex-start; }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="stars-wrap" id="stars-wrap"></div>

<div class="conn-badge" id="conn-badge">
  <div class="conn-dot"></div>
  <span id="conn-text">connecting</span>
</div>

<div class="page">
  <div class="wordmark">stellar / status</div>

  <div class="grid">
    <div class="card profile-card">
      <div class="card-inner">
        <div class="avatar-wrap">
          <img id="avatar" class="avatar" src="" alt="" />
          <div class="status-dot offline" id="status-dot"></div>
        </div>

        <div class="name-block">
          <div class="display-name" id="display-name">—</div>
          <div class="username" id="username">loading...</div>
        </div>

        <div class="custom-status" id="custom-status">
          <span>no status</span>
        </div>

        <div class="platform-row">
          <div class="platform-chip" id="platform-desktop">
            <i class="fas fa-desktop"></i> desktop
          </div>
          <div class="platform-chip" id="platform-mobile">
            <i class="fas fa-mobile-alt"></i> mobile
          </div>
          <div class="platform-chip" id="platform-web">
            <i class="fas fa-globe"></i> web
          </div>
        </div>

        <div class="divider"></div>

        <div class="kv-block" id="kv-block" style="display:none">
          <div class="kv-label">kv store</div>
          <div class="kv-pairs" id="kv-pairs"></div>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="card spotify-card" id="spotify-card">
        <div class="card-inner">
          <div class="section-label" id="spotify-label">spotify</div>
          <div id="spotify-content">
            <div class="no-spotify">
              <i class="fab fa-spotify"></i>
              <span>not listening to anything</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card activities-card" id="activities-card">
        <div class="card-inner">
          <div class="section-label">activities</div>
          <div id="activities-content">
            <div class="no-activity">no active games</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="music-bar" id="music-bar">
  <div class="music-controls">
    <button class="music-btn" id="prev-btn" title="Previous"><i class="fas fa-backward-step"></i></button>
    <button class="music-btn" id="play-btn" title="Play"><i class="fas fa-play"></i></button>
    <button class="music-btn" id="next-btn" title="Next"><i class="fas fa-forward-step"></i></button>
  </div>
  <span id="music-track" class="music-bar-track">—</span>
  <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.4" />
</div>

<audio id="audio"></audio>

<script>
(function() {
  const wrap = document.getElementById('stars-wrap');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('div');
    s.classList.add('star');
    s.style.setProperty('--top-offset', `${Math.random() * 150 - 25}vh`);
    s.style.setProperty('--fall-duration', `${Math.random() * 10 + 5}s`);
    s.style.setProperty('--fall-delay', `${Math.random() * 10}s`);
    wrap.appendChild(s);
  }
})();

(function() {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 140; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random(),
        s: Math.random() * 0.003 + 0.001
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      s.a += s.s;
      if (s.a > 1) s.s = -s.s;
      if (s.a < 0) s.s = Math.abs(s.s);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,175,255,${s.a * 0.7})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initStars(); });
  resize(); initStars(); draw();
})();

(function MusicPlayer() {
  const playlist = [
    { title: "Wonder If U Care — flyingfish", url: "https://github.com/exophs/Status/raw/refs/heads/main/music/status_wonder_if_u_care.mp3" },
    { title: "Twin Flames — Midrift", url: "https://github.com/exophs/Status/raw/refs/heads/main/music/Twin_Flames.mp3" },
    { title: "Think Of Me Once In A While — Take Care", url: "https://github.com/exophs/Status/raw/refs/heads/main/music/Take_Care-Think_Of_Me_Once_In_A_While.mp3" },
    { title: "unrequited — Midrift", url: "https://github.com/exophs/Status/raw/refs/heads/main/music/unrequited.mp3" },
    { title: "wish I didnt kno her — snor, d3r", url: "https://github.com/exophs/Status/raw/refs/heads/main/music/wish_I_didnt_kno_her-%23%23biblemusic.mp3" },
    { title: "Kiss Me Again (Nightcore) — Roy Bee", url: "https://github.com/exophs/Status/raw/refs/heads/main/music/ROY_BEE-Kiss_Me_Again_(Nightcore-Official-Mix).mp3" },
    { title: "The Perfect Girl — Mareux", url: "https://github.com/exophs/Status/raw/refs/heads/main/music/Mareux-The_Perfect_Girl_(Audio).mp3" }
  ];

  for (let i = playlist.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
  }

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play-btn');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const volSlider = document.getElementById('vol-slider');
  const trackLabel = document.getElementById('music-track');

  let idx = 0;
  let playing = false;

  function load(i) {
    idx = (i + playlist.length) % playlist.length;
    audio.src = playlist[idx].url;
    trackLabel.textContent = playlist[idx].title;
    if (playing) audio.play().catch(() => {});
  }

  function toggle() {
    if (!playing) {
      audio.play().then(() => {
        playing = true;
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        playBtn.classList.add('active');
      }).catch(() => {});
    } else {
      audio.pause();
      playing = false;
      playBtn.innerHTML = '<i class="fas fa-play"></i>';
      playBtn.classList.remove('active');
    }
  }

  audio.addEventListener('ended', () => load(idx + 1));
  playBtn.addEventListener('click', toggle);
  prevBtn.addEventListener('click', () => load(idx - 1));
  nextBtn.addEventListener('click', () => load(idx + 1));
  volSlider.addEventListener('input', e => { audio.volume = e.target.value; });

  audio.volume = volSlider.value;
  load(0);
})();

(function DiscordStatus() {
  const UID = "494913490419449857";
  let socket = null;
  let raf = null;
  let reconnectTimer = null;
  let isVisible = true;

  const $ = id => document.getElementById(id);

  function setConn(state) {
    const badge = $('conn-badge');
    const text = $('conn-text');
    badge.className = 'conn-badge ' + state;
    text.textContent = state === 'connected' ? 'live' : state;
  }

  function formatMs(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const h = Math.floor(m / 60);
    if (h > 0) return `${h}:${String(m % 60).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
    return `${m}:${String(s % 60).padStart(2,'0')}`;
  }

  function getActivityImageURL(activity, type) {
    const assets = activity.assets;
    if (!assets) return null;
    const key = type === 'large' ? assets.large_image : assets.small_image;
    if (!key) return null;
    if (key.startsWith('mp:external/')) {
      return 'https://media.discordapp.net/external/' + key.slice('mp:external/'.length);
    }
    if (activity.application_id) {
      return `https://cdn.discordapp.com/app-assets/${activity.application_id}/${key}.png`;
    }
    return null;
  }

  function updatePresence(p) {
    if (!isVisible) return;

    const u = p.discord_user;
    const avatarURL = `https://cdn.discordapp.com/avatars/${UID}/${u.avatar}.png?size=128`;
    const avatarEl = $('avatar');
    if (avatarEl.src !== avatarURL) avatarEl.src = avatarURL;

    $('display-name').textContent = u.global_name || u.username;
    $('username').textContent = '@' + u.username;

    const dot = $('status-dot');
    dot.className = 'status-dot ' + (p.discord_status || 'offline');

    const customAct = p.activities.find(a => a.type === 4);
    const csEl = $('custom-status');
    if (customAct && (customAct.state || customAct.emoji)) {
      let html = '';
      if (customAct.emoji) {
        if (customAct.emoji.id) {
          const ext = customAct.emoji.animated ? 'gif' : 'png';
          html += `<img src="https://cdn.discordapp.com/emojis/${customAct.emoji.id}.${ext}" alt="" />`;
        } else {
          html += customAct.emoji.name + ' ';
        }
      }
      if (customAct.state) html += `<span>${customAct.state}</span>`;
      csEl.innerHTML = html;
    } else {
      csEl.innerHTML = '<span>no status</span>';
    }

    ['desktop','mobile','web'].forEach(pl => {
      const el = $('platform-' + pl);
      el.classList.toggle('active', !!p['active_on_discord_' + pl]);
    });

    const kv = p.kv;
    const kvBlock = $('kv-block');
    const kvPairs = $('kv-pairs');
    if (kv && Object.keys(kv).length > 0) {
      kvPairs.innerHTML = '';
      Object.entries(kv).forEach(([k, v]) => {
        const row = document.createElement('div');
        row.className = 'kv-pair';
        row.innerHTML = `<span class="kv-key">${k}</span><span class="kv-val">${v}</span>`;
        kvPairs.appendChild(row);
      });
      kvBlock.style.display = '';
    } else {
      kvBlock.style.display = 'none';
    }

    updateSpotify(p);
    updateActivities(p);
  }

  function updateSpotify(p) {
    const content = $('spotify-content');
    const label = $('spotify-label');
    if (raf) { cancelAnimationFrame(raf); raf = null; }

    if (p.listening_to_spotify && p.spotify) {
      const sp = p.spotify;
      label.innerHTML = '<i class="fab fa-spotify" style="color:var(--spotify);margin-right:5px"></i>spotify';
      content.innerHTML = `
        <div class="spotify-top">
          <img class="album-art" src="${sp.album_art_url}" alt="" />
          <div class="spotify-meta">
            <div class="spotify-tag"><i class="fas fa-music"></i> now playing</div>
            <a class="song-title" href="https://open.spotify.com/track/${sp.track_id}" target="_blank" rel="noopener">${sp.song}</a>
            <div class="artist-name">${sp.artist}</div>
            <div class="album-name">${sp.album}</div>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress-times">
            <span id="sp-cur">0:00</span>
            <span id="sp-end">${formatMs(sp.timestamps.end - sp.timestamps.start)}</span>
          </div>
          <div class="progress-track"><div class="progress-fill" id="sp-fill"></div></div>
        </div>
      `;
      tickProgress(sp.timestamps.start, sp.timestamps.end);
    } else {
      label.textContent = 'spotify';
      content.innerHTML = `<div class="no-spotify"><i class="fab fa-spotify"></i><span>not listening to anything</span></div>`;
    }
  }

  function tickProgress(start, end) {
    const now = Date.now();
    const elapsed = now - start;
    const total = end - start;
    const pct = Math.min((elapsed / total) * 100, 100);

    const fill = $('sp-fill');
    const cur = $('sp-cur');
    if (fill) fill.style.width = pct + '%';
    if (cur) cur.textContent = formatMs(Math.min(elapsed, total));

    if (pct < 100 && isVisible) raf = requestAnimationFrame(() => tickProgress(start, end));
  }

  function updateActivities(p) {
    const acts = p.activities.filter(a => a.type === 0);
    const container = $('activities-content');
    if (acts.length === 0) {
      container.innerHTML = '<div class="no-activity">no active games</div>';
      return;
    }

    container.innerHTML = '';
    acts.forEach(act => {
      const largeImg = getActivityImageURL(act, 'large');
      const smallImg = getActivityImageURL(act, 'small');

      const elapsed = act.timestamps?.start
        ? `<div class="activity-elapsed">${formatMs(Date.now() - act.timestamps.start)} elapsed</div>`
        : '';

      const imgHTML = largeImg
        ? `<div class="activity-art-wrap">
             <img class="activity-large-img" src="${largeImg}" alt="" title="${act.assets?.large_text || ''}" />
             ${smallImg ? `<img class="activity-small-img" src="${smallImg}" alt="" title="${act.assets?.small_text || ''}" />` : ''}
           </div>`
        : '';

      const el = document.createElement('div');
      el.className = 'activity-item';
      el.innerHTML = `
        ${imgHTML}
        <div class="activity-info">
          <div class="activity-name">${act.name}</div>
          ${act.details ? `<div class="activity-details">${act.details}</div>` : ''}
          ${act.state ? `<div class="activity-state">${act.state}</div>` : ''}
          ${elapsed}
        </div>
      `;
      container.appendChild(el);
    });
  }

  function connect() {
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
    setConn('reconnecting');
    socket = new WebSocket('wss://api.lanyard.rest/socket');

    socket.addEventListener('open', () => {
      socket.send(JSON.stringify({ op: 2, d: { subscribe_to_id: UID } }));
    });

    socket.addEventListener('message', e => {
      const msg = JSON.parse(e.data);
      if (msg.op === 1) {
        setConn('connected');
      }
      if (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE') {
        const p = msg.d;
        updatePresence(p);
        try { sessionStorage.setItem('lp', JSON.stringify(p)); } catch (_) {}
      }
    });

    socket.addEventListener('close', () => {
      setConn('reconnecting');
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 5000);
    });

    socket.addEventListener('error', () => {
      setConn('reconnecting');
      socket.close();
    });
  }

  document.addEventListener('visibilitychange', () => {
    isVisible = !document.hidden;
    if (isVisible) {
      try {
        const cached = sessionStorage.getItem('lp');
        if (cached) updatePresence(JSON.parse(cached));
      } catch (_) {}
      connect();
    } else {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    }
  });

  try {
    const cached = sessionStorage.getItem('lp');
    if (cached) updatePresence(JSON.parse(cached));
  } catch (_) {}

  connect();
})();
</script>
</body>
</html>
